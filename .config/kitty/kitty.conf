include tokyonight.conf

background_opacity 0.97
background_blur 1

tab_bar_style         custom
tab_separator         ""
tab_title_template    "[{index}] {title}"
tab_title_max_length  25
tab_bar_edge          top
active_tab_font_style bold

enable_audio_bell no

font_size   13.0
font_family family="JetBrainsMono Nerd Font"

shell             fish
shell_integration enabled
cursor_shape      beam


allow_remote_control yes
listen_on            unix:/tmp/kitty

input_delay        0
repaint_delay      2
sync_to_monitor    no
wayland_enable_ime no


## Keymaps

action_alias kitty_scrollback_nvim kitten '~/.local/share/npage/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py' --env NVIM_APPNAME=npage

clear_all_shortcuts yes

kitty_mod ctrl+shift

map       kitty_mod+s     kitty_scrollback_nvim
map       kitty_mod+d     kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map kitty_mod+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

map kitty_mod+v paste_from_clipboard
map kitty_mod+c copy_to_clipboard

map kitty_mod+u change_font_size current 0
map kitty_mod+i change_font_size current +1.0
map kitty_mod+o change_font_size current -1.0

map kitty_mod+n new_tab_with_cwd
map kitty_mod+t new_tab_with_cwd !neighbor

map kitty_mod+q close_window

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

map alt+ctrl+1 kitten move_tab.py 1
map alt+ctrl+2 kitten move_tab.py 2
map alt+ctrl+3 kitten move_tab.py 3
map alt+ctrl+4 kitten move_tab.py 4
map alt+ctrl+5 kitten move_tab.py 5
map alt+ctrl+6 kitten move_tab.py 6
map alt+ctrl+7 kitten move_tab.py 7
map alt+ctrl+8 kitten move_tab.py 8
map alt+ctrl+9 kitten move_tab.py 9
map alt+ctrl+0 kitten move_tab.py 10

map kitty_mod+m move_tab_forward
map kitty_mod+, move_tab_backward

### Layouts / split manipulations

enabled_layouts splits,stack

map kitty_mod+z toggle_layout stack

# rotating:
map kitty_mod+[ layout_action rotate
map kitty_mod+] layout_action rotate

# splitting:
map kitty_mod+j kitten split_window.py down
map kitty_mod+k kitten split_window.py up
map kitty_mod+h kitten split_window.py left
map kitty_mod+l kitten split_window.py right

# moving between splits:
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+h neighboring_window left
map alt+l neighboring_window right

map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+l

# swapping splits:
map alt+left move_window left
map alt+down move_window down
map alt+up move_window up
map alt+right move_window right

map --when-focus-on var:IS_NVIM alt+left
map --when-focus-on var:IS_NVIM alt+down
map --when-focus-on var:IS_NVIM alt+up
map --when-focus-on var:IS_NVIM alt+right

# resizing splits:
map alt+ctrl+j kitten relative_resize.py down  5
map alt+ctrl+k kitten relative_resize.py up    5
map alt+ctrl+h kitten relative_resize.py left  5
map alt+ctrl+l kitten relative_resize.py right 5

map --when-focus-on var:IS_NVIM alt+ctrl+j
map --when-focus-on var:IS_NVIM alt+ctrl+k
map --when-focus-on var:IS_NVIM alt+ctrl+h
map --when-focus-on var:IS_NVIM alt+ctrl+l
