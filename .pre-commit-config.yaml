# yaml-language-server: $schema=https://raw.githubusercontent.com/j178/prek/refs/heads/master/prek.schema.json

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        entry: alejandra
        args: ["-q"]
        types: [nix]
        language: system

      - id: stylua
        name: styLua
        entry: stylua
        types: [lua]
        language: system

      - id: shfmt
        name: shfmt
        entry: shfmt
        args: ["--write"]
        types: [shell]
        language: system

      - id: tombi-format
        name: tombi-format
        entry: tombi format
        types: [toml]
        exclude:
          glob: "*.lock"
        language: system
      - id: tombi-lint
        name: tombi-lint
        entry: tombi lint
        types: [toml]
        exclude:
          glob: "*.lock"
        language: system
