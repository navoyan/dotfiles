o script-binding mfpbar/maximize
P script-binding mfpbar/maximize


h           seek -5  exact
l           seek  5  exact
LEFT        seek -15  exact
RIGHT       seek  15  exact
H           seek -80 exact
L           seek  80 exact

j    add volume -1
k    add volume  1
DOWN add volume -3
UP   add volume  3

t cycle sub
T cycle sub down

Ctrl+l       ab-loop
Ctrl+Shift+l cycle-values loop-file "inf" "no"


ENTER ignore

[ add chapter -1
] add chapter  1

{ multiply speed 1/1.1
} multiply speed 1.1
